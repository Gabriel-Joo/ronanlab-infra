# MySQL Replica(2026-11-10 가용성 묶음 2) — Primary(runshoes-mysql-0, w1)의 binlog 를 받아 따라간다. 자동 전환은 없다 — 승격은 사람이 한다.
# 구성 · 승격 · 다시 만들기 절차: ronanlab-infra docs/runbooks/mysql-replica.md (petmint 와 같은 모양 — apps/petmint/mysql/replica.yaml)
# - binlog 파일 · 위치 복제(GTID 꺼짐), server-id 2, read_only 는 SET PERSIST 로(인자로 걸면 승격 때 못 푼다)
# - MYSQL_DATABASE · MYSQL_USER 를 주지 않는다 — 데이터베이스 · 계정은 Primary 덤프(mysql 스키마 포함)로 온다
# - 복제 계정 비밀번호 Secret mysql-repl(사람이 만든다) → REPL_PASSWORD. 없어도 Pod 는 뜬다(optional)
# - Primary 와 다른 app 노드(w2)에. 앱은 Service runshoes-mysql(Primary)만 본다 — 승격하면 그 selector 를 바꾼다
apiVersion: v1
kind: Service
metadata:
  name: runshoes-mysql-replica
  labels:
    app.kubernetes.io/name: runshoes-mysql-replica
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: runshoes-mysql-replica
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runshoes-mysql-replica
  labels:
    app.kubernetes.io/name: runshoes-mysql-replica
spec:
  serviceName: runshoes-mysql-replica
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runshoes-mysql-replica
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runshoes-mysql-replica
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      nodeSelector:
        node.ronanlab.dev/role: app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: runshoes-mysql
      containers:
        - name: mysql
          image: mysql:8.0.46
          args:
            - --server-id=2
            - --relay-log=relay-bin
            - --innodb-buffer-pool-size=256M
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-time-zone=+00:00
            - --performance-schema=OFF
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: runshoes-mysql, key: MYSQL_ROOT_PASSWORD } }
            - name: REPL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-repl, key: password, optional: true } }
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi

# 앱(Spring Boot — React 빌드물 + /api, :3000)과 챗봇 사이드카(파이썬 웹소켓, :8766) 한 Pod.
# 상태는 MySQL(runshoes-mysql)에 있고 앱은 무상태다 — 롤링은 한 Pod 씩(maxSurge 0, maxUnavailable 1): 옛 Pod 하나를 내리고 그 자리에 새 Pod, 그동안 남은 하나가 받는다(아래 strategy 주석).
# Ready 는 DB 까지 본다(/readyz — readiness 그룹 readinessState + db, 2026-11-14 전에는 /actuator/health/readiness). 스키마 · 시드는 앱이 기동 때 Flyway 로 넣는다.
# 챗봇은 앱과 같은 커밋 · 태그로 빌드한다(kustomization images). 롤링 때 열려 있던 WebSocket 은 한 번 끊기고 프런트가 다시 붙는다.
#
# Ollama(리뷰 요약 · 챗봇)는 GPU 호스트에 있다 — Pod 가 VM 사설망으로 바로 간다(petmint 와 같은 주소).
#
# replicas 2 · 노드 분산(2026-11-10, 가용성 묶음 1) — petmint 와 같다: required anti-affinity 로 두 Pod 를 서로 다른 노드에,
# PDB(pdb.yaml, minAvailable 1)로 drain 때 둘을 한꺼번에 내보내지 않는다. 노드 하나가 죽어도 다른 Pod 가 받는다.
# 배치 고정(2026-11-10 가용성 묶음 2): app 노드(w1 · w2, node.ronanlab.dev/role=app)에만 뜬다. 노드가 둘뿐이라
# 새 Pod 를 먼저 띄우는 롤링(maxSurge 1, 2+1개)은 세 번째 Pod 가 갈 곳이 없다 → 옛 Pod 하나를 먼저 내리고 새 Pod(maxSurge 0,
# maxUnavailable 1). 롤링 동안 잠깐 Pod 가 하나다. 전에는 maxSurge 1 · maxUnavailable 0 이었다(2026-11-10 전).
# app 노드 하나가 죽으면 두 번째 Pod 는 그 노드가 돌아올 때까지 Pending 이고, 그동안 롤링은 멈춘다(남은 하나가 받는다).
# 시도 제한(RateLimiter)은 DB 에 있어 Pod 가 둘이어도 갈리지 않는다. 챗봇 WebSocket 은 연결이 붙은 Pod 에 머문다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runshoes
  labels:
    app.kubernetes.io/name: runshoes
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runshoes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runshoes
      # Spring 지표(2026-11-14, 런슈즈 관리자 부탁): Prometheus job kubernetes-pods(apps/monitoring/prometheus/configmap.yaml)가 이 주석을 보고
      # Pod IP:9000 을 긁는다. 9000 은 관리 포트(이미지 f9ee36e01331 부터)라 Service · Ingress 에 없어 바깥에서 닿지 않는다.
      # 주석은 Pod 에 포트 하나 — 챗봇 사이드카는 긁히지 않는다
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Harbor runshoes 프로젝트가 private — scripts/create-secrets.sh 가 만드는 pull Secret
      imagePullSecrets:
        - name: harbor-pull
      terminationGracePeriodSeconds: 30
      nodeSelector:
        node.ronanlab.dev/role: app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: runshoes
      initContainers:
        # 재부팅 때 앱이 MySQL 보다 먼저 뜨면 Flyway 가 DB 에 못 붙어 앱이 스스로 끝난다(2026-11-06 재시작 2회, lastState Error).
        # startupProbe 는 liveness 를 늦출 뿐 앱이 스스로 끝나는 것은 못 막는다 → 3306 이 열릴 때까지 여기서 기다린다.
        # Service 를 거치므로 MySQL readinessProbe(mysqladmin ping)가 통과해야 열린다. 2초 × 90 = 3분 넘으면 실패 → kubelet 이 백오프로 다시 돈다(무한 대기 아님)
        - name: wait-mysql
          image: docker.io/library/busybox:1.37.0   # 4MB · 공개 이미지 — 사설 레지스트리 불필요(IfNotPresent 라 노드마다 한 번)
          command:
            - sh
            - -c
            - |
              i=0
              until nc -z -w 2 runshoes-mysql 3306; do
                i=$((i+1))
                if [ "$i" -ge 90 ]; then echo "runshoes-mysql:3306 3분 동안 안 열림"; exit 1; fi
                sleep 2
              done
              echo "mysql ok (기다림 ${i}회)"
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: runshoes
          image: harbor.ronanlab.dev/runshoes/runshoes   # 태그는 kustomization images 가 붙인다
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://runshoes-mysql:3306/runshoes?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: runshoes
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: runshoes-mysql, key: MYSQL_PASSWORD } }
            - name: TZ
              value: UTC
            - name: OLLAMA_URL
              value: "http://192.168.122.1:11434"
            # 로그인 화면의 체험 카드(시드 3 + 데모 관리자, 앱 리포 docs/ADMIN_DEMO_DESIGN.md 8.3) — V7 이미지부터 읽는다. 끄려면 "false"
            - name: DEMO_LOGIN_ENABLED
              value: "true"
          # 로그인(앱 리포 docs/AUTH_DESIGN.md) — Secret runshoes-auth 의 키가 그대로 env 이름이다: JWT_SECRET · SEED_USER_PASSWORD · ADMIN_PASSWORD.
          # 사람이 만든다(scripts/create-secrets.sh). optional 이 아니다 — Secret 이 없으면 새 Pod 가 CreateContainerConfigError 로 멈추고
          # (롤링이 거기서 멈추고 남은 옛 Pod 하나가 계속 받는다) V3 이미지가 JWT_SECRET 없이 뜨는 일이 없다. V3 전 이미지는 이 env 를 읽지 않는다
          envFrom:
            - secretRef:
                name: runshoes-auth
          # 이미지가 사용자 10001 로 돈다(Dockerfile USER). 챗봇 컨테이너는 root 라 Pod 전체가 아니라 이 컨테이너에만
          securityContext:
            runAsNonRoot: true
          # 첫 기동은 Flyway 가 스키마 · 시드를 넣는다 — startupProbe 가 기다리는 동안 liveness 가 죽이지 않는다(최대 2분)
          # 경로(2026-11-14, 런슈즈 관리자 부탁 A-2 2단계): /readyz · /livez 는 앱 포트 3000 에 더한 상태 경로다
          # (management.endpoint.health.probes.add-additional-paths, 이미지 35537160ce73 부터). 전에는 /actuator/health · /actuator/health/readiness · /actuator/health/liveness.
          # 다음 단계에서 actuator 를 관리 포트로 옮겨도 이 둘은 3000 에 남는다. 그 전 이미지로 되돌리면 404 로 Ready 가 안 된다 — 이미지를 되돌릴 때는 이 경로도 함께 되돌린다
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]          # Ingress 가 엔드포인트를 뺄 시간 — 그 뒤 SIGTERM(앱은 graceful shutdown)
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
        - name: chatbot
          image: harbor.ronanlab.dev/runshoes/runshoes-chatbot
          ports:
            - name: chatbot
              containerPort: 8766
          env:
            - name: OLLAMA_URL                 # chatbot_server.py 가 읽는다
              value: "http://192.168.122.1:11434"
            # model-service(호스트, KURE-v1 임베딩 · 리랭커). 챗봇 5-2 검색 색인이 이 env로만 받는다(코드 기본값 없음).
            # 없으면 서버는 뜨지만 색인을 만들지 않아 경험·후기 질문에 「잠시 뒤」로 답한다. 2026-11-13 런슈즈 관리자 부탁
            - name: MODEL_SERVICE_URL
              value: "http://192.168.122.1:8200"
            - name: PYTHONUNBUFFERED           # print 로그가 kubectl logs 에 바로 보이게
              value: "1"
          readinessProbe:
            tcpSocket: { port: chatbot }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: chatbot }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 256Mi }

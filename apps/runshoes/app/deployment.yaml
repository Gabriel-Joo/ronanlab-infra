# 앱(Spring Boot — React 빌드물 + /api, :3000)과 챗봇 사이드카(파이썬 웹소켓, :8766) 한 Pod.
# 상태는 MySQL(runshoes-mysql)에 있고 앱은 무상태다 — 롤링은 한 Pod 씩(maxSurge 1, maxUnavailable 0): 새 Pod 가 Ready 가 돼야 옛 Pod 를 내린다.
# Ready 는 DB 까지 본다(/actuator/health/readiness — readinessState + db). 스키마 · 시드는 앱이 기동 때 Flyway 로 넣는다.
# 챗봇은 앱과 같은 커밋 · 태그로 빌드한다(kustomization images). 롤링 때 열려 있던 WebSocket 은 한 번 끊기고 프런트가 다시 붙는다.
#
# Ollama(리뷰 요약 · 챗봇)는 GPU 호스트에 있다 — Pod 가 VM 사설망으로 바로 간다(petmint 와 같은 주소).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runshoes
  labels:
    app.kubernetes.io/name: runshoes
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: runshoes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runshoes
    spec:
      # Harbor runshoes 프로젝트가 private — scripts/create-secrets.sh 가 만드는 pull Secret
      imagePullSecrets:
        - name: harbor-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: runshoes
          image: harbor.ronanlab.dev/runshoes/runshoes   # 태그는 kustomization images 가 붙인다
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://runshoes-mysql:3306/runshoes?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: runshoes
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: runshoes-mysql, key: MYSQL_PASSWORD } }
            - name: TZ
              value: UTC
            - name: OLLAMA_URL
              value: "http://192.168.122.1:11434"
          # 로그인(앱 리포 docs/AUTH_DESIGN.md) — Secret runshoes-auth 의 키가 그대로 env 이름이다: JWT_SECRET · SEED_USER_PASSWORD · ADMIN_PASSWORD.
          # 사람이 만든다(scripts/create-secrets.sh). optional 이 아니다 — Secret 이 없으면 새 Pod 가 CreateContainerConfigError 로 멈추고
          # (maxUnavailable 0 이라 옛 Pod 는 그대로 돈다) V3 이미지가 JWT_SECRET 없이 뜨는 일이 없다. V3 전 이미지는 이 env 를 읽지 않는다
          envFrom:
            - secretRef:
                name: runshoes-auth
          # 이미지가 사용자 10001 로 돈다(Dockerfile USER). 챗봇 컨테이너는 root 라 Pod 전체가 아니라 이 컨테이너에만
          securityContext:
            runAsNonRoot: true
          # 첫 기동은 Flyway 가 스키마 · 시드를 넣는다 — startupProbe 가 기다리는 동안 liveness 가 죽이지 않는다(최대 2분)
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]          # Ingress 가 엔드포인트를 뺄 시간 — 그 뒤 SIGTERM(앱은 graceful shutdown)
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
        - name: chatbot
          image: harbor.ronanlab.dev/runshoes/runshoes-chatbot
          ports:
            - name: chatbot
              containerPort: 8766
          env:
            - name: OLLAMA_URL                 # chatbot_server.py 가 읽는다
              value: "http://192.168.122.1:11434"
            - name: PYTHONUNBUFFERED           # print 로그가 kubectl logs 에 바로 보이게
              value: "1"
          readinessProbe:
            tcpSocket: { port: chatbot }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: chatbot }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 256Mi }

# 지금 앱은 이 PVC 를 쓰지 않는다(데이터는 MySQL). 되돌리기용으로 남긴다 — 전환 전 배포(Node, db.json)가 읽던 파일이 들어 있다(README.md "되돌리기").
# 관찰 기간이 끝나면 이 파일을 지우고 PVC 도 손으로 지운다(prune 없음). StorageClass reclaimPolicy 가 Delete — PVC 를 지우면 파일도 지워진다
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runshoes-data
  labels:
    app.kubernetes.io/name: runshoes
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

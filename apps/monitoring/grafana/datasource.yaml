# Grafana 데이터소스 — 기동할 때 provisioning으로 읽는다. UI에서 바꿔도 재시작하면 이 값으로 돌아간다
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 30s     # scrape_interval과 같게 — rate() 창이 이보다 짧으면 빈 그래프가 된다
      # 서버 로그(2026-11-10) — 7일 보존, 대화 기록은 없다(alloy/)
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        editable: false
      # petmint 턴 로그(2026-11-10) — Replica(w2)를 읽는다(운영 Primary 에 부하를 주지 않게).
      # 계정 grafana_ro 는 컬럼 단위 SELECT 만 있다: turns(분류 · 시간 · 상태), sessions(mode · 시작 시각), feedback(rating).
      # 질문 · 답 · 코멘트 · 고객 · 상담원 컬럼은 권한이 없어 읽을 수 없다(ronanlab-infra apps/monitoring/README.md「petmint DB 읽기 계정」)
      - name: petmint-turns
        uid: petmint-mysql
        type: mysql
        url: mysql-replica.petmint.svc:3306
        user: grafana_ro
        editable: false
        jsonData:
          database: petmint
          maxOpenConns: 3
          maxIdleConns: 1
          connMaxLifetime: 14400
          timezone: "+00:00"     # DB 는 UTC 로 적는다
        secureJsonData:
          password: $MYSQL_PETMINT_RO_PASSWORD   # 2026-11-14 전에는 $MYSQL_RO_PASSWORD(deployment.yaml env 와 같이 바꿈)
      # runshoes(2026-11-14) — Replica(w2)를 읽는다. 계정 grafana_ro(런슈즈 쪽, 최대 연결 5)는 컬럼 단위 SELECT 와 뷰 grafana_compare_views 만 있다.
      # 챗봇 질문 · 답 원문 칸은 권한이 없다(앱 리포 docs/07_database.md 1-6절, 2026-11-14 사람이 question 칸 ERROR 1143 확인)
      - name: runshoes
        uid: runshoes-mysql
        type: mysql
        url: runshoes-mysql-replica.runshoes.svc:3306
        user: grafana_ro
        editable: false
        jsonData:
          database: runshoes
          maxOpenConns: 3
          maxIdleConns: 1
          connMaxLifetime: 14400
          timezone: "+00:00"     # DB 는 UTC 로 적는다
        secureJsonData:
          password: $MYSQL_RUNSHOES_RO_PASSWORD

# Grafana 한 대. 데이터소스는 ConfigMap(grafana-datasources), admin은 사람이 넣은 Secret grafana-admin(키 admin-user·admin-password).
# /var/lib/grafana는 emptyDir — UI에서 만든 대시보드는 Pod를 다시 만들면 사라진다. 남길 대시보드는 ConfigMap provisioning으로 넣는다(15번 3절)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      nodeSelector:
        node.ronanlab.dev/role: platform      # w4(2026-11-10)
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
        fsGroup: 472
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.3
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-user } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-password } }
            # petmint 턴 로그 읽기 계정 비밀번호 — 데이터소스(datasource.yaml)가 $MYSQL_RO_PASSWORD 로 읽는다. 사람이 만든다(README)
            - name: MYSQL_RO_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-mysql, key: password } }
            # runshoes 읽기 계정 grafana_ro 비밀번호(2026-11-14) — 데이터소스 runshoes-mysql 이 $MYSQL_RUNSHOES_RO_PASSWORD 로 읽는다.
            # 펫퍼민트와 다른 DB 계정이라 Secret 을 따로 둔다(grafana-runshoes-mysql, 사람이 만든다 — README 「처음 한 번」)
            - name: MYSQL_RUNSHOES_RO_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-runshoes-mysql, key: password } }
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # 밖으로 나가는 호출을 끈다(업데이트 확인·사용 통계·플러그인 목록)
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            # 바깥 주소(ingress.yaml, 2026-11-11) — 로그인 리다이렉트 · 공유 링크가 이 주소를 쓴다
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.ronanlab.dev/
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          # 2026-11-11: 256Mi 에서 OOMKilled(로그인 뒤 Dashboards 를 열면 검색 인덱스를 만들며 넘는다 → 바깥에서 502/503).
          # Grafana 13 은 기동만으로 ~240Mi. w4(8Gi) 라 여유가 크다
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            # 대시보드는 JSON 을 저장소에 둔다(dashboards/) — UI 에서 고친 것은 재시작하면 사라진다
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards

# 모니터링 — Prometheus·Grafana·node-exporter·kube-state-metrics(15번). Alertmanager는 없다(알림 설계 전).
# ArgoCD Application monitoring(app.yaml)이 이 디렉터리를 본다. helm install로 넣지 않는다(14번 1-9절).
# 차트를 쓰지 않고 손으로 쓴 매니페스트다 — kube-prometheus-stack의 Operator·CRD 없이 Prometheus 설정 파일 하나로 긁는다.
#
# Namespace는 여기 없다 — 사람이 만든다(Secret grafana-admin이 거기 있다. petmint와 같은 이유, README.md).
# 노출은 전부 ClusterIP. Ingress·터널은 정한 뒤에 붙인다(13번 2-3절) — 확인은 port-forward
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
    includeSelectors: false

resources:
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/statefulset.yaml
  - prometheus/service.yaml
  - node-exporter/daemonset.yaml
  - node-exporter/service.yaml
  - kube-state-metrics/rbac.yaml
  - kube-state-metrics/deployment.yaml
  - kube-state-metrics/service.yaml
  - grafana/datasource.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  # Secret grafana-admin은 여기 없다 — 평문을 저장소에 두지 않는다(README.md "처음 한 번")

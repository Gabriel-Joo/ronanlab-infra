apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
    includeSelectors: false

# Namespace · Secret(grafana-admin, grafana-mysql)은 여기 없다 — 사람이 만든다(README.md "처음 한 번")
# 모두 w4(node.ronanlab.dev/role=platform)에. node-exporter 와 alloy 만 DaemonSet 이라 모든 노드에(2026-11-10)
resources:
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/statefulset.yaml
  - prometheus/service.yaml
  - node-exporter/daemonset.yaml
  - node-exporter/service.yaml
  - kube-state-metrics/rbac.yaml
  - kube-state-metrics/deployment.yaml
  - kube-state-metrics/service.yaml
  - grafana/datasource.yaml
  - grafana/dashboard-provider.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - loki/loki.yaml                  # 서버 로그 7일(2026-11-10)
  - alloy/alloy.yaml                # 로그 수집 DaemonSet — 대화 원문 줄은 버린다
  - json-exporter/json-exporter.yaml  # Ollama /api/ps → 지표

configMapGenerator:
  - name: grafana-dashboards
    files:
      - grafana/dashboards/petmint.json
    options:
      disableNameSuffixHash: true     # deployment.yaml 이 이 이름으로 붙인다

# Cloudflare 터널 — apps/cloudflared 를 본다(2026-11-02 platform/cloudflared 에서 옮겼다). 클러스터 공용 터널(petmint·argocd·harbor·jenkins·runshoes·grafana·prometheus 공개 주소 전부, 2026-11-11 일곱).
# 적용: 루트 Application(bootstrap/root-app.yaml)이 apps/*/app.yaml 을 읽어 만든다 — 2026-11-02 App of Apps. 손으로 apply 하지 않는다
#
# 이 Application 은 자동 Sync 로 바꾸지 않는다(2026-11-11 사용자 결정 — petmint · monitoring · runshoes 는 자동, 이것만 수동).
#   터널이 깨지면 공개 주소 7개(petmint · runshoes · argocd · harbor · jenkins · grafana · prometheus)가 한꺼번에 안 보인다.
#   서비스만 멈추는 것이 아니라 고칠 도구(ArgoCD UI) · 볼 도구(Grafana)도 같이 사라지고, 되돌리기는 m-k8s 에서 kubectl 로만 된다
#   (apps/cloudflared/README.md). 그래서 커밋이 곧바로 반영되지 않게 사람이 Sync 를 누르고, 롤링을 지켜본다
# - Sync 는 수동(automated 없음)
# - prune 없음 — git 에서 지운 리소스는 클러스터에 남는다
# - finalizer 없음 — Application 을 지워도 터널 Pod 는 남는다
# - Namespace 는 만들지도 소유하지도 않는다 — Secret cloudflared-credentials 를 사람이 넣는다(apps/cloudflared/README.md)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Gabriel-Joo/ronanlab-infra.git
    targetRevision: main
    path: apps/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

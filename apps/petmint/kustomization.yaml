# 펫퍼민트 — 앱 + MySQL (14번 1-7절). ArgoCD Application petmint(platform/argocd/applications/petmint.yaml)가 이 디렉터리를 본다.
# kubectl apply로 직접 넣지 않는다 — ArgoCD와 상태가 엇갈린다(README.md "ArgoCD가 관리한다").
# 이미지 태그는 Jenkins(petmint-rag-chatbot Jenkinsfile)가 빌드 뒤 아래 newTag 한 줄을 커밋 해시 12자리로 바꿔 push한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: petmint

labels:
  - pairs:
      app.kubernetes.io/part-of: petmint
    includeSelectors: false

# Namespace는 여기 없다 — petmint 네임스페이스에는 사람이 넣은 Secret이 있다(scripts/create-secrets.sh).
# ArgoCD가 소유하면 prune·Application 삭제 한 번에 그것들이 사라질 수 있어, 네임스페이스는 사람이 만든다(Secret과 같다).
# cloudflared 터널도 예전에는 여기 있었다 — 2026-10-18 platform/cloudflared(네임스페이스 cloudflared)로 옮겼다
resources:
  - mysql/service.yaml
  - mysql/statefulset.yaml
  - data/nfs.yaml
  - app/configmap.yaml
  - jobs/init-db.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/pdb.yaml
  - app/ingress.yaml
  # Secret은 여기 없다 — 평문을 저장소에 두지 않는다. scripts/create-secrets.sh가 클러스터에 직접 만든다

images:
  - name: harbor.ronanlab.dev/petmint/petmint-app
    newTag: "5f31a6e6649b"   # Jenkins가 바꾼다(커밋 해시 12자리). 이 줄 모양을 바꾸면 Jenkinsfile의 sed도 바꾼다. latest 금지(10번 8절) — 롤링 중 어느 Pod가 무엇을 도는지 알 수 있어야 한다

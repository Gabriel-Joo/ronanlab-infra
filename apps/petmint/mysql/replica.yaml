# MySQL Replica(2026-11-10 가용성 묶음 2) — Primary(mysql-0, w1)의 binlog 를 받아 따라간다. 자동 전환은 없다 — 승격은 사람이 한다.
# 구성 · 승격 · 다시 만들기 절차: ronanlab-infra docs/runbooks/mysql-replica.md
# - 복제 방식: binlog 파일 · 위치(GTID 꺼짐). GTID 를 켜려면 Primary 를 다시 시작해야 해서 쓰지 않았다
# - server-id 2(Primary 는 기본값 1). read_only · super_read_only 는 인자가 아니라 SET PERSIST 로 건다 —
#   명령줄 인자는 PERSIST 보다 앞서서, 인자로 걸면 승격 때 SET PERSIST 로 풀 수 없다
# - 복제 계정 비밀번호는 Secret mysql-repl(사람이 만든다, 런북 1절) → 환경변수 REPL_PASSWORD. 없어도 Pod 는 뜬다(optional)
# - Primary 와 같은 노드에 두지 않는다(required anti-affinity) — app 노드(w1 · w2) 중 Primary 가 없는 w2 에 뜬다
# - 앱은 이 Pod 를 보지 않는다 — Service mysql 은 Primary 만 고른다. 승격하면 그 Service 의 selector 를 바꾼다(런북 3절)
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  labels:
    app.kubernetes.io/name: mysql-replica
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql-replica
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica
  labels:
    app.kubernetes.io/name: mysql-replica
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: mysql-replica
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-replica
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-replica
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      nodeSelector:
        node.ronanlab.dev/role: app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mysql
      containers:
        - name: mysql
          image: mysql:8.0.46                 # Primary 와 같은 버전
          args:
            - --server-id=2
            - --relay-log=relay-bin
            - --innodb-buffer-pool-size=256M
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-root, key: MYSQL_ROOT_PASSWORD }
            - name: REPL_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-repl, key: password, optional: true }
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

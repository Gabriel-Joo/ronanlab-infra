# 비밀이 아닌 접속 정보만(14번 1-4절). 비밀번호는 Secret(petmint-db, insurance-seed-db, mysql-root)에서 따로 받는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: petmint-app-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # 서비스 DB — 클러스터 안 MySQL(Service "mysql")
  PETMINT_DB_HOST: mysql
  PETMINT_DB_PORT: "3306"
  PETMINT_DB_NAME: petmint
  PETMINT_DB_USER: petmint_app
  # 고객 원장(기간계 흉내) — SELECT만. 실무에서는 기간계 쪽 주소·계정으로 바꾼다
  PETMINT_CORE_DB_HOST: mysql
  PETMINT_CORE_DB_PORT: "3306"
  PETMINT_CORE_DB_NAME: insurance_core
  PETMINT_CORE_DB_USER: petmint_app

  # ---- GPU 호스트에 남는 것(14번 1-1절) ----
  # Pod에서 localhost는 Pod 자신이다. VM 사설 네트워크(libvirt default, 192.168.122.0/24)의 호스트 쪽 주소를 쓴다(14번 1-4절).
  # 이 대역은 Vagrantfile에 고정 IP로 박혀 있어 VM을 다시 만들어도 바뀌지 않는다(2026-10-16 워커 3대의 Pod에서 확인)
  PETMINT_OLLAMA_URL: "http://192.168.122.1:11434"
  PETMINT_MILVUS_URL: "http://192.168.122.1:19530"
  # search-service — 호스트 프로세스(python -m search_service.main), 192.168.122.1:8100에만 연다(2026-10-21 기동)
  PETMINT_SEARCH_URL: "http://192.168.122.1:8100"
  # 호스트 Ollama의 모델 이름(app/config.py). 어댑터를 바꾸면 RAG 쪽만 바꾼다 — 호스트에 ollama create로 먼저 올려 둔다.
  # envFrom이라 이 값만 바꿔서는 떠 있는 Pod에 반영되지 않는다 — Sync 뒤 rollout restart(롤링)
  PETMINT_MODEL_BASE: tri-7b
  PETMINT_MODEL_RAG: kabyul-tri-7b-rag1-rebuild4-ckpt462

  # 약관 데이터 — 호스트 NFS(PVC petmint-chunks·petmint-graph)를 /var/lib/petmint 아래에 붙인다(이미지 기본값과 같다)
  # 청크 v3(약관 호·법령박스 분할, 2026-10-22) — NFS 공유 안의 v3 폴더. 앱 이미지가 f7991c9 이후여야 한다
  # (그 전 이미지는 variant를 사내규정 검색에도 붙여 503 — hr_regulation_v3 컬렉션이 없다)
  PETMINT_CHUNKS_DIR: /var/lib/petmint/chunks/v3
  PETMINT_GRAPH_DIR: /var/lib/petmint/graph/v3

  # ---- 검색·답 표시 플래그(2026-10-23 운영 반영 측정 — 리포 data/review/rollout_measure.md) ----
  # 되돌리기: 아래 열네 줄을 지우고 위 두 줄을 /var/lib/petmint/chunks·graph로 → Sync 뒤 rollout restart("코드만" 상태)
  PETMINT_SEARCH_VARIANT: v3           # search-service의 Milvus petmint_*_v3 컬렉션으로 찾는다(약관만)
  PETMINT_DISPLAY_PARENT: "1"          # v3 조각으로 찾고 모델에게는 부모(원래 청크) 글을 보여 준다
  PETMINT_SEARCH_EXPAND: "1"           # 질의 확장(고객 말 → 약관 말, BM25·리랭커 질의에만)
  PETMINT_EXPAND_DICT: v2              # 동의어 사전 v2(62항목)
  PETMINT_ANSWER_TABLES: "1"           # 답이 쓴 발췌의 표를 답 아래에
  PETMINT_RULE_FIRST: "1"              # 보장 여부 — 같은 조의 원칙(제1항)을 참조에서 본문 앞으로(1안)
  PETMINT_COVERAGE_CODE: "1"           # 그 반려동물 부담보에 걸리는 보장 질문은 코드가 특약 제2조로 답한다(3안′)
  PETMINT_SEARCH_POOL: "50"            # 1차 후보 깊이(Dense·BM25 각각) 20 → 50 — 리포 data/review/pool_measure.md
  PETMINT_AGE_CODE: "1"                # 신규 가입 나이(숫자)를 묻는 질문은 코드가 약관 기준(만 8세, 실속형 만 10세)과 비교해 답한다 — 리포 data/review/age_measure.md
  PETMINT_PROVISO_CODE: "1"            # 면책 단서(⑫ 침술·② 1년 이내 예방접종·⑲ Ⅰ 유형 구강질환)가 보장 쪽으로 빼 주는 질문은 코드가 답한다 — 리포 data/review/proviso_measure.md
  PETMINT_TWIN_ARTICLE: "1"            # 특약 낱말 없는 질문이 보통약관(사람 보험) 제3·5조로 가면 같은 제목 의료비 특약 조(제1·2조)를 그 앞으로 — 리포 data/review/human_article_measure.md
  PETMINT_ASK_DISEASE: "1"             # 병명 없이 보장을 묻는 질문("○○가 입원했어요. 보장되나요?")은 가입 특약 원칙 + 병명 되묻기를 코드가 답한다 — 리포 data/review/disease_ask_measure.md
  PETMINT_ASK_DISEASE_LLM: "1"         # 병명 되묻기에서 "병명·증상 이름이 있는가"를 베이스 모델(tri-7b)이 본다(실패하면 정규식) — 리포 data/review/disease_ask_llm_measure.md
  PETMINT_NAMED_COVER: "1"             # 병명이 있는 보장 질문("감기도 보장되나요?")은 그 특약 제2조 면책 목록과 대조해 코드가 답한다, 금액 되묻기 뒤 병명 질문은 되묻기를 되풀이하지 않는다 — 리포 data/review/named_cover_measure.md

  # Cloudflare Access 헤더가 없을 때의 상담원 값. 클러스터에서 헤더가 없다는 것은 Access를 거치지 않은 요청이다 — 로그에서 드러나게
  PETMINT_DEFAULT_AGENT: no-access-header@petmint
  # 앱 자체 로그인(2026-10-28, 리포 docs/13 2-1절·docs/14 1-16) — 사번·비밀번호, 서버 저장 세션 쿠키(HttpOnly·Secure·SameSite=Lax).
  # 위 헤더 값은 access 모드에서만 쓴다. 되돌리기: 이 줄을 지우고 Sync 뒤 rollout restart(Access 헤더가 다시 신원이 된다)
  PETMINT_AUTH: "app"
  # 사내규정 개인화(2026-10-28) — 로그인한 직원 본인의 연차 잔여·퇴직금·자격수당·승진 시점은 인사 원장으로 코드가 답한다 — 리포 data/review/hr_personal_measure.md
  PETMINT_HR_PERSONAL: "1"
  # 일반·사내규정 상담 제목을 LLM(호스트 Ollama, GPU — 베이스 tri-7b)으로 짓는다. 업무특화는 늘 첫 질문 첫 줄(앱 코드 titles.uses_llm —
  # 파인튜닝 모델과 GPU를 번갈아 쓰면 첫 답변이 약 5초 늦어진다). 0이면 모든 모드가 첫 질문 첫 줄. 앱 이미지가 이 코드를 가진 뒤에 1로
  PETMINT_TITLE_LLM: "1"
---
# 초기화 Job만 쓰는 값(앱은 쓰지 않는다)
apiVersion: v1
kind: ConfigMap
metadata:
  name: petmint-init-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  BOOTSTRAP_APPS: PETMINT,INSURANCE_SEED   # runshoes는 자기 네임스페이스의 Job이 만든다(Secret은 네임스페이스별)
  INSURANCE_SEED_DB_HOST: mysql
  INSURANCE_SEED_DB_PORT: "3306"
  INSURANCE_SEED_DB_NAME: insurance_core
  INSURANCE_SEED_DB_USER: insurance_seed

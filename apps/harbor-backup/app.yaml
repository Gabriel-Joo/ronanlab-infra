# Harbor DB 백업 — apps/harbor-backup 을 본다. 루트 Application(bootstrap/root-app.yaml)이 이 파일로 만든다(손으로 apply 하지 않는다).
# - 자동 Sync — 이미지 태그 커밋이 없고 CronJob · PV/PVC 뿐이라 바뀌면 바로 들어가도 된다. prune · selfHeal 끔
# - finalizer 없음 — Application 을 지워도 CronJob · PV/PVC(Retain)는 남는다
# - Namespace harbor 는 Helm 차트가 만든다 — 만들지도 소유하지도 않는다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Gabriel-Joo/ronanlab-infra.git
    targetRevision: main
    path: apps/harbor-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false

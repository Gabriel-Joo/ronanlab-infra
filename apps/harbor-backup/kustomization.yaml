# Harbor DB 백업 — ArgoCD Application harbor-backup(app.yaml)이 이 디렉터리를 본다.
# Harbor 자체는 platform/harbor(Helm, ArgoCD 밖)다. 백업 CronJob 만 여기서 git 으로 관리한다(petmint MySQL 백업과 같은 방식).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor

labels:
  - pairs:
      app.kubernetes.io/part-of: harbor-backup
    includeSelectors: false

# Namespace · Secret harbor-database 는 Helm 차트 harbor 가 만든다 — 여기 없다
resources:
  - cronjob.yaml

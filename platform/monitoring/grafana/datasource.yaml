# Grafana 데이터소스 — 기동할 때 provisioning으로 읽는다. UI에서 바꿔도 재시작하면 이 값으로 돌아간다
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 30s     # scrape_interval과 같게 — rate() 창이 이보다 짧으면 빈 그래프가 된다

# jenkins.ronanlab.dev 인증서 → Secret jenkins/jenkins-tls. Harbor 와 같은 ClusterIssuer(letsencrypt-prod, DNS-01)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jenkins-tls
  namespace: jenkins
spec:
  secretName: jenkins-tls
  dnsNames:
    - jenkins.ronanlab.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod

expose:
  type: ingress
  # 인증서는 cert-manager 가 만든다(platform/cert-manager/harbor-certificate.yaml → Secret harbor-tls, Let's Encrypt DNS-01).
  # 노드 containerd 가 사설 VIP(192.168.122.240)로 https 를 검증해 당긴다 — Harbor 토큰 주소(externalURL)가 https 라서.
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  ingress:
    hosts:
      core: harbor.ronanlab.dev
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

externalURL: https://harbor.ronanlab.dev

# certSource: secret 이면 이 차트(1.19.2)는 core 의 ca-download 볼륨 secretName 을 비워 둔다 — 같은 Secret 을 준다
caSecretName: harbor-tls

# 2026-11-10 가용성 묶음 2 — 데이터를 w3 한 곳으로. 전에는 registry · trivy(w2), database(w3), redis · jobservice(w1)에 흩어져
# 어느 워커를 내려도 Harbor 일부가 멈췄다. 새 PVC 는 platform/harbor/pvc-w3.yaml(사람이 apply), 옛 PVC 는 지우지 않고 남겼다.
# existingClaim 을 쓰면 차트가 PVC 를 만들지 않는다 — registry · jobservice 의 옛 PVC 는 resource-policy: keep 이라 helm 이 지우지 않는다.
persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry-w3
      storageClass: local-path
      # 실제 PVC(harbor-registry-w3)와 같게 30Gi. 지금은 existingClaim 이라 쓰이지 않는다 — 2026-11-12 helm template(1.19.2)로 20Gi · 30Gi
      # 렌더가 Secret 말고 같고 PVC 를 만들지 않음을 확인. existingClaim 을 떼면 이 값으로 PVC 가 생긴다(같은 렌더에서 storage: 30Gi).
      # 지우지 않는 까닭: 지우면 레지스트리 저장소가 얼마인지 저장소 어디에도 남지 않는다
      size: 30Gi
    jobservice:
      jobLog:
        existingClaim: harbor-jobservice-w3
        storageClass: local-path
        size: 1Gi
    database:
      existingClaim: harbor-database-w3
      storageClass: local-path
      size: 5Gi
    redis:
      existingClaim: harbor-redis-w3
      storageClass: local-path
      size: 1Gi
    trivy:
      existingClaim: harbor-trivy-w3
      storageClass: local-path
      size: 5Gi

trivy:
  enabled: true
  nodeSelector: { node.ronanlab.dev/role: infra }

# 모든 구성 요소를 w3(infra)에 — cluster/label-nodes.sh
portal:
  nodeSelector: { node.ronanlab.dev/role: infra }
core:
  nodeSelector: { node.ronanlab.dev/role: infra }
jobservice:
  nodeSelector: { node.ronanlab.dev/role: infra }
registry:
  nodeSelector: { node.ronanlab.dev/role: infra }
database:
  internal:
    nodeSelector: { node.ronanlab.dev/role: infra }
redis:
  internal:
    nodeSelector: { node.ronanlab.dev/role: infra }

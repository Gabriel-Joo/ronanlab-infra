expose:
  type: ingress
  # 인증서는 cert-manager 가 만든다(platform/cert-manager/harbor-certificate.yaml → Secret harbor-tls, Let's Encrypt DNS-01).
  # 노드 containerd 가 사설 VIP(192.168.122.240)로 https 를 검증해 당긴다 — Harbor 토큰 주소(externalURL)가 https 라서.
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  ingress:
    hosts:
      core: harbor.ronanlab.dev
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

externalURL: https://harbor.ronanlab.dev

# certSource: secret 이면 이 차트(1.19.2)는 core 의 ca-download 볼륨 secretName 을 비워 둔다 — 같은 Secret 을 준다
caSecretName: harbor-tls

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: local-path
      size: 20Gi
    jobservice:
      jobLog:
        storageClass: local-path
        size: 1Gi
    database:
      storageClass: local-path
      size: 5Gi
    redis:
      storageClass: local-path
      size: 1Gi
    trivy:
      storageClass: local-path
      size: 5Gi

trivy:
  enabled: true

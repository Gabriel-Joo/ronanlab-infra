# - VIP 192.168.122.240(MetalLB 풀 private): 사설망 안에서 80/443 표준 포트로 Ingress 에 닿는다(노드 containerd → Harbor)
# - nodePort 30517/31925 는 고정한다: 이 포트로 붙던 기존 경로를 살려 둔다
# - ports 의 protocol 은 빼지 않는다: Service ports 의 병합 키가 port+protocol 이라, 빠지면 nodePort 가 출력에서 사라진다
# - ClusterIP 는 건드리지 않는다: 터널(cloudflared)은 Service DNS :443 으로 붙는다
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  annotations:
    metallb.io/address-pool: private
    metallb.io/loadBalancerIPs: 192.168.122.240
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      protocol: TCP
      nodePort: 30517
    - name: https
      port: 443
      protocol: TCP
      nodePort: 31925

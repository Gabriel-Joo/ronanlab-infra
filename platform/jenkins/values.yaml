controller:
  jenkinsUrlProtocol: https
  jenkinsUrl: https://jenkins.ronanlab.dev

  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.ronanlab.dev
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # 인증서는 cert-manager(platform/cert-manager/jenkins-certificate.yaml, letsencrypt-prod DNS-01)
    tls:
      - secretName: jenkins-tls
        hosts:
          - jenkins.ronanlab.dev

  serviceType: ClusterIP

  # admin 비밀번호는 차트가 만들지 않는다 — 사람이 넣은 Secret jenkins/jenkins-admin(키 jenkins-admin-user·jenkins-admin-password).
  # 차트 기본 JCasC 가 기동할 때마다 이 값으로 admin 을 박으므로, UI 에서 바꾼 비밀번호는 재시작하면 사라진다 — 바꾸려면 이 Secret 을 바꾼다
  admin:
    createSecret: true          # true 여야 JCasC 가 읽는 파일로 마운트된다. existingSecret 이 있으면 차트 Secret 은 만들지 않는다
    existingSecret: jenkins-admin

  # Harbor robot$petmint+jenkins(petmint 프로젝트 push) — 사람이 넣은 Secret jenkins/harbor-robot-jenkins(키 username·password).
  # JCasC 안에서 ${harbor-robot-jenkins-username} 처럼 부른다
  additionalExistingSecrets:
    - name: harbor-robot-jenkins
      keyName: username
    - name: harbor-robot-jenkins
      keyName: password
    # ronanlab-infra 쓰기 deploy key(apps/petmint 이미지 태그 push) — scripts/make-deploy-keys.sh 가 만든 Secret jenkins/ronanlab-infra-deploy-key
    - name: ronanlab-infra-deploy-key
      keyName: ssh-privatekey
    # Harbor robot$runshoes+jenkins(runshoes 프로젝트 push) — 사람이 넣은 Secret jenkins/harbor-robot-runshoes-jenkins(키 username·password)
    - name: harbor-robot-runshoes-jenkins
      keyName: username
    - name: harbor-robot-runshoes-jenkins
      keyName: password
    # GitHub 웹훅 공유 시크릿(2026-11-03) — 사람이 넣은 Secret jenkins/github-webhook-secret(키 secret). petmint-rag-chatbot · runshoes 웹훅이 같이 쓴다.
    # ArgoCD 웹훅(ronanlab-infra)은 다른 값이다(argocd/argocd-secret webhook.github.secret)
    - name: github-webhook-secret
      keyName: secret

  JCasC:
    configScripts:
      petmint: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: harbor-robot-petmint-jenkins
                      description: "Harbor robot$petmint+jenkins — petmint 프로젝트 push"
                      username: "${harbor-robot-jenkins-username}"
                      password: "${harbor-robot-jenkins-password}"
                  - basicSSHUserPrivateKey:
                      scope: GLOBAL
                      id: ronanlab-infra-deploy-key
                      username: git
                      description: "ronanlab-infra deploy key(쓰기) — apps/petmint 이미지 태그 push. 이 저장소에만 쓸 수 있다"
                      privateKeySource:
                        directEntry:
                          privateKey: "${ronanlab-infra-deploy-key-ssh-privatekey}"
                  - string:
                      scope: GLOBAL
                      id: github-webhook-secret
                      description: "GitHub 웹훅 공유 시크릿 — /github-webhook/ 서명(X-Hub-Signature-256) 검증"
                      secret: "${github-webhook-secret-secret}"
        # GitHub 웹훅(2026-11-03): https://jenkins.ronanlab.dev/github-webhook/ — Cloudflare Access 는 이 경로만 Bypass, 나머지는 그대로.
        # 지켜 주는 것은 HMAC SHA-256 서명이다. 훅은 사람이 GitHub 에서 손으로 걸었다(토큰 없음 — 플러그인이 훅을 관리하지 않는다)
        unclassified:
          gitHubPluginConfig:
            hookSecretConfigs:
              - credentialsId: github-webhook-secret
                signatureAlgorithm: SHA256
        jobs:
          # petmint 앱 이미지 빌드 → Harbor push. 파이프라인 본문은 앱 리포의 Jenkinsfile.
          # 2026-11-03부터 GitHub 웹훅(githubPush)이 주력이다. pollSCM 15분은 웹훅을 놓쳤을 때의 안전망(전에는 Access 에 막혀 2분 폴링만)
          - script: |
              pipelineJob('petmint-app') {
                description('petmint-rag-chatbot main → harbor.ronanlab.dev/petmint/petmint-app:<커밋 12자리>. JCasC 가 만든다 — UI 에서 고치지 않는다')
                properties {
                  pipelineTriggers {
                    triggers {
                      githubPush()
                      pollSCM {
                        scmpoll_spec('H/15 * * * *')
                      }
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/Gabriel-Joo/petmint-rag-chatbot.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                    lightweight(true)
                  }
                }
              }
      # RUNSHOES — petmint 와 같은 모양. JCasC 는 configScripts 파일들을 합친다(credentials·jobs 목록이 이어 붙는다).
      # Job 을 처음 더한 helm upgrade 뒤에는 Job 이 목록에 안 보일 수 있다 — 기동 중 JCasC 가 Job 을 만든 직후 Jenkins 가 디스크 목록으로 덮었다
      # (2026-10-18, jobs/runshoes-app/config.xml 은 있는데 API 404). POST /configuration-as-code/reload(관리 → Configuration as Code → Reload) 한 번이면 나타난다
      # ronanlab-infra 쓰기 deploy key(ronanlab-infra-deploy-key)는 위 petmint 블록의 것을 같이 쓴다 — 저장소 단위 키라 apps/runshoes 에도 쓸 수 있다
      runshoes: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: harbor-robot-runshoes-jenkins
                      description: "Harbor robot$runshoes+jenkins — runshoes 프로젝트 push"
                      username: "${harbor-robot-runshoes-jenkins-username}"
                      password: "${harbor-robot-runshoes-jenkins-password}"
        jobs:
          # runshoes 앱·챗봇 이미지 빌드 → Harbor push → apps/runshoes 태그 커밋. 파이프라인 본문은 앱 리포의 Jenkinsfile
          - script: |
              pipelineJob('runshoes-app') {
                description('runshoes main → harbor.ronanlab.dev/runshoes/{runshoes,runshoes-chatbot}:<커밋 12자리>. JCasC 가 만든다 — UI 에서 고치지 않는다')
                properties {
                  pipelineTriggers {
                    triggers {
                      githubPush()
                      pollSCM {
                        scmpoll_spec('H/15 * * * *')
                      }
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/Gabriel-Joo/runshoes.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                    lightweight(true)
                  }
                }
              }

  installPlugins:
    - kubernetes:4560.vc25b_83890c34
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.11.0
    - configuration-as-code:2136.veb_3a_554550b_f
    - job-dsl:3732.v9a_c49a_61a_313          # JCasC jobs: 로 Pipeline Job 을 만든다
    - github:1.47.0                          # /github-webhook/ — 웹훅 서명 검증(hookSecretConfigs SHA256) · githubPush 트리거(2026-11-03)

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

persistence:
  enabled: true
  storageClass: local-path
  size: 8Gi

agent:
  enabled: true

rbac:
  create: true

serviceAccount:
  create: true
  name: jenkins

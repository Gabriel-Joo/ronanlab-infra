# CoreDNS(kubeadm 기본 Corefile) + harbor.ronanlab.dev 재작성.
#   kubectl apply -f platform/coredns/configmap.yaml   (reload 플러그인이 30초 안에 다시 읽는다)
# 클러스터 안 Pod 가 harbor.ronanlab.dev 를 공개 DNS(Cloudflare → Access)로 풀지 않고 ingress-nginx 내부 Service 로 가게 한다.
# 노드 /etc/hosts(→ MetalLB VIP)와 같은 일을 클러스터 안에서 한다 — 이미지 이름이 어디서나 harbor.ronanlab.dev 로 같고,
# Harbor 토큰 주소(https://harbor.ronanlab.dev/service/token)도 같은 길로 가며 Let's Encrypt 인증서로 검증된다.
# harbor-core Service 로 직접 가지 않는 이유: Harbor 가 토큰 주소를 https://<요청 호스트>/service/token 으로 내려주는데
# harbor-core 는 80만 연다. answer auto: 응답 이름을 harbor.ronanlab.dev 로 되돌린다. AAAA 는 빈 응답이라 공개 IPv6 로 새지 않는다.
# kubeadm upgrade 는 Corefile 을 옮겨 적는다 — 업그레이드 뒤 rewrite 블록이 남았는지 확인한다
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        rewrite stop {
            name exact harbor.ronanlab.dev ingress-nginx-controller.ingress-nginx.svc.cluster.local
            answer auto
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }

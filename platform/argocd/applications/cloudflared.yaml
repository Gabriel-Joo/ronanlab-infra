# Cloudflare 터널 — platform/cloudflared 를 본다. 클러스터 공용 터널(petmint·argocd·harbor·jenkins 공개 주소 전부).
# 적용: kubectl apply -f platform/argocd/applications/cloudflared.yaml (Application 자체는 아직 사람이 넣는다)
#
# petmint.yaml 과 같은 규칙. 이 Application 은 특히 자동으로 바꾸지 않는다 — ArgoCD 자신에게 오는 길을 관리한다.
# 잘못된 커밋 하나가 Sync 되면 ArgoCD UI 도 끊긴다(되돌리기는 m-k8s kubectl, platform/cloudflared/README.md)
# - Sync 는 수동(automated 없음)
# - prune 없음 — git 에서 지운 리소스는 클러스터에 남는다
# - finalizer 없음 — Application 을 지워도 터널 Pod 는 남는다
# - Namespace 는 만들지도 소유하지도 않는다 — Secret cloudflared-credentials 를 사람이 넣는다(platform/cloudflared/README.md)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Gabriel-Joo/ronanlab-infra.git
    targetRevision: main
    path: platform/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
